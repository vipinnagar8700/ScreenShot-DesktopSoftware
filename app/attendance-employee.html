		<script>
			document.addEventListener("DOMContentLoaded", async () => {
			  // Render Feather Icons
			  feather.replace();
		  
			  const fileIcon = document.getElementById("fileIcon");
			  const passwordModal = new bootstrap.Modal(document.getElementById("passwordModal"));
			  const screenshotModal = new bootstrap.Modal(document.getElementById("screenshotModal"));
			  const passwordInput = document.getElementById("passwordInput");
			  const submitPassword = document.getElementById("submitPassword");
			  const imageContainer = document.getElementById("imageContainer");
		  
			  // Dummy password
			  const PASSWORD = "1234";
		  
			  // Click event to show the password modal
			  fileIcon.addEventListener("click", () => {
				passwordModal.show();
			  });
		  
			  // Validate password and show the screenshot modal
			  submitPassword.addEventListener("click", async () => {
				const enteredPassword = passwordInput.value;
		  
				if (enteredPassword === PASSWORD) {
				  // If password is correct, populate and show screenshot modal
				  await populateModal();
				  passwordModal.hide();
				  screenshotModal.show();
				} else {
				  alert("Incorrect password. Please try again.");
				  passwordInput.value = ""; // Clear input
				}
			  });
		  
			  // Function to populate the screenshot modal with images
			  const populateModal = async () => {
				imageContainer.innerHTML = ""; // Clear previous images
		  
				try {
				  // Fetch the screenshot paths from the main process
				  const screenshotPaths = await window.electronAPI.getScreenshots();
		  
				  // Add images to modal
				  screenshotPaths.forEach((absolutePath) => {
					const col = document.createElement("div");
					col.className = "col-md-3 mb-3";
		  
					const img = document.createElement("img");
		  
					// Ensure the file path is correctly formatted for use in the renderer
					const formattedPath = `C:/Users/pc/Desktop/WindowTest/${absolutePath.replace(/\\/g, "/")}`;
		  
					img.src = formattedPath;  // Use the properly formatted absolute path
					img.className = "img-fluid rounded";
					img.alt = "Screenshot";
					col.appendChild(img);
					imageContainer.appendChild(col);
				  });
				} catch (error) {
				  console.error("Error loading screenshots:", error);
				}
			  };
			});
		  </script>

		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const daysOverviewList = document.getElementById("daysOverview");
		
				// Function to get the current week's days
				const getCurrentWeek = () => {
					const week = [];
					const currentDate = new Date();
					const currentDay = currentDate.getDay(); // 0 for Sunday, 1 for Monday, etc.
		
					// Start from Sunday (first day of the week)
					const startOfWeek = new Date(currentDate);
					startOfWeek.setDate(currentDate.getDate() - currentDay);
		
					// Generate dates for the next 7 days
					for (let i = 0; i < 7; i++) {
						const date = new Date(startOfWeek);
						date.setDate(startOfWeek.getDate() + i);
		
						// Push date and day name
						week.push({
							date: date.getDate(),
							day: date.toLocaleDateString("en-US", { weekday: "long" }),
						});
					}
		
					return week;
				};
		
				// Get current week's dates
				const currentWeek = getCurrentWeek();
		
				// Populate the list dynamically
				currentWeek.forEach(({ date, day }) => {
					// Create LI element
					const li = document.createElement("li");
					li.classList.add("box-attend");
		
					// Create the inner card div
					const cardDiv = document.createElement("div");
					cardDiv.classList.add("warming-card");
		
					// Add date and day
					cardDiv.innerHTML = `
						<h4>${date}</h4>
						<h6>${day}</h6>
					`;
		
					// Append the card div to the list item
					li.appendChild(cardDiv);
		
					// Append the list item to the UL
					daysOverviewList.appendChild(li);
				});
			});
		</script>

		<script>
			let timerInterval;
			let startTime;

			// Attach the button click event
			document.getElementById("start-btn").addEventListener("click", () => {
				console.log("Start button clicked.");
				window.electronAPI.startScreenshot();
alert("Your Timer Started! Now your laptop is under observation.");
				// Start the timer
				startTime = new Date();
				timerInterval = setInterval(() => {
					const now = new Date();
					const elapsedTime = new Date(now - startTime);
					const hours = String(elapsedTime.getUTCHours()).padStart(2, '0');
					const minutes = String(elapsedTime.getUTCMinutes()).padStart(2, '0');
					const seconds = String(elapsedTime.getUTCSeconds()).padStart(2, '0');
					document.getElementById("current-timeer").textContent = `${hours}:${minutes}:${seconds}`;
				}, 1000);
			});

			document.getElementById("stop-btn").addEventListener("click", () => {
				console.log("Stop button clicked.");
				window.electronAPI.stopScreenshot();

				// Stop the timer
				clearInterval(timerInterval);
				alert("Your Timer Stopped! Now your laptop is removed from  observation.");
			});
		</script>
		<script>
			document.addEventListener("DOMContentLoaded", async () => {
			  const logoutButton = document.getElementById("logout-button");
			  const userNameSpan = document.getElementById("user-name");
			  const userRoleSpan = document.getElementById("user-role");
			  const userNameSpana = document.getElementById("user-namea");
			  const userRoleSpana = document.getElementById("user-rolea");
			  const userRoleSpanaa = document.getElementById("user-roleaa");
		  
			  try {
				// Get user data from Electron API
				const user = await window.electronAPI.getUser();
		  
				if (user && user.isLoggedIn) {
				  // Display the user's name and role
				  userNameSpan.textContent = user.user.name; // e.g., "John Smilga"
				  userRoleSpan.textContent = user.user.role; // e.g., "Super Admin"
				  userNameSpana.textContent = user.user.name; // e.g., "John Smilga"
				  userRoleSpana.textContent = user.user.role; // e.g., "Super Admin"
				  userRoleSpanaa.textContent = user.user.name;
				} else {
				  // If not logged in, redirect to the signin page
				  alert("You are not logged in.");
				  window.location.href = "signin.html";
				}
			  } catch (error) {
				console.error("Failed to fetch user data:", error);
				alert("An error occurred. Please try again.");
				window.location.href = "signin.html";
			  }
		  
			  // Logout handler
			  logoutButton.addEventListener("click", () => {
				window.electronAPI.logout();
			  });
			});
		  </script>
		<script>
			document.addEventListener("DOMContentLoaded", () => {
			  const dateElement = document.getElementById("current-date");
			  const timeElement = document.getElementById("current-time");
		  
			  // Function to format the current date
			  function formatDate(date) {
				const options = { year: 'numeric', month: 'short', day: 'numeric' };
				return date.toLocaleDateString(undefined, options);
			  }
		  
			  // Function to format the current time
			  function formatTime(date) {
				return date.toLocaleTimeString(undefined, { hour12: false });
			  }
		  
			  // Function to update date and time
			  function updateDateTime() {
				const now = new Date();
				dateElement.textContent = formatDate(now); // Update date
				timeElement.textContent = formatTime(now); // Update time
			  }
		  
			  // Update date and time immediately and then every second
			  updateDateTime();
			  setInterval(updateDateTime, 1000);
			});
		  </script>
